name: Auto PR on Push

on:
  push:
    branches-ignore:
      - main
      - master

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check if PR already exists and create if not
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if a PR already exists for this branch
          existing_pr=$(gh pr list --head "${{ github.ref_name }}" --state open --json number --jq '.[0].number')
          
          if [ -z "$existing_pr" ]; then
            echo "Creating a new Pull Request..."
            gh pr create \
              --title "Auto-generated PR from ${{ github.ref_name }}" \
              --body "This pull request was automatically created upon pushing to \`${{ github.ref_name }}\`." \
              --base main \
              --head "${{ github.ref_name }}"
          else
            echo "Pull Request #$existing_pr already exists for this branch."
          fi